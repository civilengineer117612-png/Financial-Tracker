<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finance</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finance">
<meta name="theme-color" content="#111111">
<style>
  :root { --chart: #2a78d6; --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b; --ink: #111; --mid: #555; --soft: #999; --line: #ccc; --wash: #f0f0f0; --paper: #fff; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.4; color: var(--ink); background: var(--paper);
         padding: max(12px, env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--mid); text-transform: uppercase; letter-spacing: .04em; }
  p { margin: 6px 0; }
  .sub { color: var(--mid); margin: 0 0 12px; }
  .note { color: var(--mid); }
  button { font: inherit; color: var(--ink); background: var(--wash); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 48px; }
  button:active { background: var(--line); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); width: 100%; font-size: 18px; min-height: 56px; }
  button.primary:active { background: var(--mid); }
  button:disabled { opacity: .4; }
  .filebtn { display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--paper); border-radius: 8px; font-size: 18px; min-height: 56px; margin-top: 12px; cursor: pointer; }
  .filebtn[aria-disabled="true"] { opacity: .4; }
  .shot { display: block; width: 100%; max-height: 260px; object-fit: contain; background: var(--wash); border-radius: 8px; }
  .shot[hidden], .shotfull[hidden] { display: none; }
  .shotbtn { display: block; width: 100%; padding: 0; min-height: 0; border: 0; background: none; margin-bottom: 10px; }
  .shotfull { display: block; width: 100%; max-height: 70vh; object-fit: contain; }
  .rawtext { white-space: pre-wrap; font: 13px/1.4 ui-monospace, monospace; color: var(--mid); max-height: 160px; overflow: auto; background: var(--wash); padding: 8px; border-radius: 8px; }
  details summary { min-height: 44px; display: flex; align-items: center; }
  button.link { background: none; border: 0; padding: 4px 0; min-height: 0; text-decoration: underline; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 84px; gap: 2px; }
  .tile b { font-size: 17px; }
  .tile span { color: var(--mid); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #top { display: flex; align-items: center; gap: 12px; margin: 0 0 6px; }
  #top h1 { margin: 0; }
  .menubtn { width: 48px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .menubtn svg { display: block; }
  #menu .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); }
  #menu .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 21; width: min(80%, 320px); background: var(--paper); border-right: 2px solid var(--ink);
                  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); overflow: auto;
                  display: flex; flex-direction: column; }
  #menu .drawer .groups { flex: 1; }
  #menu .drawer .foot { border-top: 1px solid var(--line); padding-top: 8px; }
  h2.today { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); }
  #menu .drawer h2 { margin-top: 4px; }
  #menu .drawer button.item { display: flex; align-items: center; gap: 18px; width: 100%; text-align: left; margin: 0; padding: 0 4px; font-size: 18px; min-height: 56px;
                              border: 0; border-radius: 0; background: none; color: var(--ink); }
  #menu .drawer button.item[aria-current="page"] span { font-weight: 700; }
  #menu .drawer hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  #menu .drawer .glabel { margin: 12px 4px 2px; font-size: 14px; color: var(--mid); }
  .tbl td.vu { color: var(--chart); } .tbl td.vo { color: var(--critical); }
  svg.trend { display: block; width: 100%; height: auto; margin-top: 8px; border-bottom: 1px solid var(--line); }
  svg .tl { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg .tl.tb, svg line.tb { stroke: var(--mid); } svg .tl.tb { stroke-dasharray: 4 3; } svg circle.tb { fill: var(--mid); stroke: var(--paper); stroke-width: 2; }
  svg .tl.ta, svg line.ta { stroke: var(--chart); } svg circle.ta { fill: var(--chart); stroke: var(--paper); stroke-width: 2; }
  .tlabs { display: flex; gap: 6px; margin-top: 2px; }
  .tmonth { flex: 1; min-height: 44px; padding: 0; border: 0; background: none; color: var(--mid); font-size: 13px; }
  svg.donut { display: block; width: min(100%, 260px); margin: 12px auto 4px; }
  svg.donut .slice { transition: opacity .15s; } svg.donut .slice.dim { opacity: .3; }
  svg.donut .dtotal { font-size: 20px; font-weight: 700; fill: var(--ink); } svg.donut .dsub { font-size: 12px; fill: var(--mid); }
  .legendlist { margin-top: 6px; }
  .lrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 0 2px; min-height: 44px; border-bottom: 1px solid var(--line); border-radius: 0; font-size: 16px; }
  .lrow.dim { opacity: .45; } .lrow[aria-pressed="true"] .lname { font-weight: 700; }
  .lrow .swatch { width: 14px; height: 14px; border-radius: 3px; flex: none; } .lrow .lname { flex: 1; } .lrow .lval { color: var(--ink); font-variant-numeric: tabular-nums; }
  .daytotal { text-align: center; font-size: 40px; font-weight: 700; margin: 14px 0 0; }
  p.center { text-align: center; margin: 0 0 10px; }
  .daycap { color: var(--mid); margin: 0; }
  .ptitle { flex: 1; border: 0; background: none; font-weight: 700; font-size: 18px; min-height: 48px; }
  .stepper.single .ptitle { text-align: center; }
  .flip { cursor: pointer; } .flip:active { opacity: .8; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; } .mgrid button { min-height: 48px; } .mgrid button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); } .mgrid button:disabled { opacity: .3; }
  .rangepick { display: flex; gap: 8px; margin: 8px 0; }
  .rangepick button { flex: 1; text-align: left; display: flex; flex-direction: column; padding: 8px 12px; min-height: 56px; }
  .rangepick small { color: var(--mid); font-weight: 400; font-size: 13px; } .rangepick b { font-size: 16px; }
  .cols.tight, .clabs.tight { gap: 3px; } .col.dim { opacity: .4; }
  .stepper.yr button { min-width: 44px; padding: 0 6px; }
  .bankpick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 52px; padding: 8px 12px; }
  .bankpick .muted { color: var(--mid); } .bankpick span:not(.ico):not(.chev):not(.muted) { flex: 1; } .bankpick .muted { flex: 1; } .bankpick .chev { font-size: 22px; color: var(--mid); }
  .banklist { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--line); margin: 8px 0; }
  .bankrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; min-height: 56px; padding: 6px 4px; font-size: 17px; }
  .bankrow span:nth-child(2) { flex: 1; } .bankrow .tick { font-weight: 700; } .bankrow[aria-pressed="true"] span:nth-child(2) { font-weight: 700; }
  .note.small { font-size: 13px; }
  .cal .blank { min-height: 44px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 8px 0; }
  .cal .dow { text-align: center; color: var(--mid); font-size: 13px; padding: 4px 0; font-weight: 400; }
  .cal button { min-height: 44px; padding: 0; font-size: 16px; font-weight: 400; } .cal button.has { font-weight: 800; } .cal button:disabled { opacity: .3; }
  .glyph { vertical-align: -1px; margin-right: 4px; flex: none; }
  .glyph.g-good { fill: var(--good); } .glyph.g-warning { fill: var(--warn); } .glyph.g-serious { fill: var(--serious); } .glyph.g-critical { fill: var(--critical); } .glyph.g-none { color: var(--mid); }
  .bars .brow.g-good .bfill, .meter.g-good .fill { background: var(--good); }
  .bars .brow.g-warning .bfill, .meter.g-warning .fill { background: var(--warn); }
  .bars .brow.g-serious .bfill, .meter.g-serious .fill { background: var(--serious); }
  .bars .brow.g-critical .bfill, .meter.g-critical .fill { background: var(--critical); }
  .bars .brow.g-none .bfill { background: var(--soft); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--mid); font-size: 13px; margin: 6px 0; }
  .meter { position: relative; height: 16px; background: var(--wash); border-radius: 0 4px 4px 0; margin: 5px 0 4px; }
  .meter.goal .fill { background: var(--chart); }
  .meter .fill { display: block; height: 16px; border-radius: 0 4px 4px 0; }
  .meter .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
  .status { display: flex; align-items: center; color: var(--mid); font-size: 14px; }
  .bcard { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .bcard .btop { margin-bottom: 0; }
  .choice { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 12px 0; min-height: 56px; }
  .choice small { color: var(--mid); display: block; }
  .chip { display: inline-flex; align-items: center; gap: 8px; }
  .icowrap { position: relative; display: inline-block; flex: none; vertical-align: middle; } .icowrap .ico.ov { position: absolute; inset: 0; background: #fff; }
  .ico { border-radius: 8px; object-fit: cover; flex: none; vertical-align: middle; }
  .mono { display: inline-flex; align-items: center; justify-content: center; background: var(--wash); border: 1px solid var(--line); color: var(--mid); font-weight: bold; }
  .who { display: flex; align-items: center; gap: 12px; }
  .icobtn { padding: 0; min-height: 0; border: 0; background: none; }
  .stage { width: 240px; height: 240px; margin: 12px auto; border: 2px solid var(--ink); border-radius: 20px; overflow: hidden; position: relative; touch-action: none; background: var(--wash); }
  .stage img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; }
  .stepper { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 10px; }
  .stepper b { font-size: 18px; }
  .stepper button { width: 48px; font-size: 22px; padding: 0; }
  .hero { font-size: 48px; font-weight: bold; line-height: 1.1; margin: 6px 0 2px; }
  .seg { display: flex; gap: 6px; margin: 8px 0; }
  .seg button { flex: 1; padding: 10px 4px; min-height: 44px; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .bars { margin: 12px 0 4px; }
  .brow { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; padding: 8px 0; min-height: 52px; }
  .brow:active { background: var(--wash); }
  .brow.dim { opacity: .45; }
  .brow[disabled] { opacity: 1; }
  .btop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 5px; }
  .bname { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .bval { color: var(--mid); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .btrack { display: block; height: 14px; background: var(--wash); border-radius: 0 4px 4px 0; }
  .bfill { display: block; height: 14px; background: var(--chart); border-radius: 0 4px 4px 0; }
  .caption { min-height: 44px; color: var(--mid); margin: 6px 0; }
  .cols { display: flex; align-items: flex-end; gap: 6px; height: 190px; border-bottom: 1px solid var(--line); margin-top: 12px; }
  .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: none; border: 0; border-radius: 0; padding: 0; height: 100%; min-height: 44px; }
  .col:active { background: var(--wash); }
  .col.dim { opacity: .45; }
  .cbar { display: block; width: 24px; background: var(--chart); border-radius: 4px 4px 0 0; }
  .cval { font-size: 12px; color: var(--mid); min-height: 16px; margin-bottom: 3px; white-space: nowrap; }
  .clabs { display: flex; gap: 6px; margin-top: 4px; }
  .clabs span { flex: 1; text-align: center; color: var(--mid); font-size: 13px; }
  .tbl { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .tbl th, .tbl td { text-align: left; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .tbl th { color: var(--mid); font-weight: normal; }
  .tbl .n { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl tr.total td { font-weight: bold; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row small { color: var(--mid); display: block; }
  .row .amt { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .card { border: 1px solid var(--ink); border-radius: 10px; padding: 16px; margin: 10px 0; }
  .card .big { font-size: 34px; font-weight: bold; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .card .what { font-size: 20px; }
  .card dl { margin: 0; display: grid; grid-template-columns: 95px 1fr; gap: 4px 8px; color: var(--mid); }
  .card dd { margin: 0; color: var(--ink); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .actions .wide { grid-column: 1 / -1; }
  input[type=range] { accent-color: var(--ink); padding: 0; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 1px; }
  label { display: block; margin: 12px 0 4px; color: var(--mid); }
  input, select, textarea { font: inherit; width: 100%; padding: 12px; border: 1px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); min-height: 48px; }
  #banner .bar { background: var(--wash); border: 1px solid var(--ink); border-radius: 8px; padding: 10px 12px; margin: 0 0 10px; }
  #nav { z-index: 1; position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2, 1fr); background: var(--paper); border-top: 1px solid var(--line);
         padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  #nav button { border-radius: 8px; padding: 12px 4px; font-size: 15px; }
  #nav button[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); }
  .sheet { z-index: 11; position: fixed; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; background: var(--paper); border-top: 2px solid var(--ink);
           border-radius: 14px 14px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; font-size: 20px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5; }
  #toast .bar { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #toast .bar button { background: none; border: 1px solid var(--paper); color: var(--paper); min-height: 40px; }
  #toast .extra { background: var(--wash); border: 1px solid var(--ink); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
</style>
</head>
<body>
<header id="top"></header>
<div id="banner"></div>
<main id="screen"></main>
<div id="sheet"></div>
<div id="toast"></div>
<div id="menu"></div>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
</html>
