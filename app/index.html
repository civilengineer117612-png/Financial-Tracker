  input, select, textarea { font: inherit; font-size: 16px; width: 100%; padding: 12px; border: 1px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink); min-height: 48px; }
  #banner .bar { background: var(--wash); border: 1px solid var(--ink); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; }
  #nav { z-index: 1; position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(2, 1fr); background: var(--paper); border-top: 1px solid var(--line);
         padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); gap: 8px; }
  #nav button { border-radius: 10px; padding: 12px 4px; font-size: 15px; }
  #nav button[aria-current="page"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); }
  .sheet { z-index: 11; position: fixed; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; overflow-wrap: anywhere; background: var(--paper); border-top: 2px solid var(--ink);
           border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); }
  @keyframes sheetup { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes scrimin { from { opacity: 0; } to { opacity: 1; } }
  .sheet.enter { animation: sheetup .22s ease-out; } #scrim.enter { animation: scrimin .2s ease-out; }
  @media (prefers-reduced-motion: reduce) { .sheet.enter, #scrim.enter { animation: none; } button { transition: none; } }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; }
  body.locked { position: fixed; left: 0; right: 0; width: 100%; overflow: hidden; }   /* the page stays still while a window is open */
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 5; }
  #toast .bar { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #toast .bar button { background: none; border: 1px solid var(--paper); color: var(--paper); min-height: 40px; }
  #toast .extra { background: var(--wash); border: 1px solid var(--ink); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
</style>
</head>
<body>
<header id="top"></header>
<div id="banner"></div>
<main id="screen"></main>
<div id="sheet"></div>
<div id="toast"></div>
<div id="menu"></div>
<nav id="nav"></nav>
<script type="module" src="app.js"></script>
</body>
