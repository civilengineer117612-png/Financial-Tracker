name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the site files
        run: |
          mkdir -p _site/app _site/src
          # The storage probe stays at the site root, untouched.
          cp index.html manifest.json sw.js icon-180.png icon-512.png _site/
          # The finance app and the model code it imports live under /app and /src.
          cp app/* _site/app/
          cp -r src/model _site/src/model
          # The on-phone photo reader (open-source, copied unchanged) is served from this site too, so a photo is never sent elsewhere.
          cp -r src/vendor _site/src/vendor
          # A new version stamp per deploy makes every phone install the fresh offline worker.
          sed -i "s/__VERSION__/${GITHUB_SHA::12}/" _site/app/sw.js
          # The version and date Setup shows ("Version abc1234, updated Oct 5, 2026").
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/; s/__BUILT_ON__/$(TZ=Asia/Manila date +%F)/" _site/src/model/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
